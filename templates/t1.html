{% extends "base.html" %}

{% block content %}

<h1>Task 1 page</h1>
<section id="form">
  <form action="{{url_for('getSearchCriteria')}}">
    <fieldset>
      <p>
        <label for="query">Search NASA Images</label>
        <input id="query" type="text" size="24" maxlength="64" name="query" required>
      </p>
      <p>
        <input id="submit" type="submit" value="Submit">
      </p>
    </fieldset>
  </form>
</section>

{% if have_results %}
<section id="results">
  <h1>{{imgPath}}</h1>
</section>
{% endif %}
{% endblock %}
