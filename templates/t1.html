{% extends "base.html" %}

{% block content %}

<section id="form">
  <form action="{{url_for('getSearchCriteria')}}">
    <fieldset>
      <p>
        <label for="query">Search NASA Images</label>
        <input id="query" type="text" size="24" maxlength="64" name="query" placeholder="moon landing" required>
      </p>
      <p>
        <input id="submit" type="submit" value="Search" class="btn">
      </p>
    </fieldset>
  </form>
</section>


<section id="results">
  <h3>Results</h3>
  {% if have_results %}
  <img src="{{imgPath}}">
  <p>{{description}}</p>
  {% endif %}
</section>
{% endblock %}
